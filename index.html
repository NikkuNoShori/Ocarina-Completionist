<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Ocarina of Time Checklists</title>
    <meta name="description" content="Track every Gold Skulltula, Heart Piece, Magic Bean, Great Fairy, song, upgrade and bottle in the Switch 2 Ocarina of Time remake." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&family=Cormorant+SC:wght@600;700&family=EB+Garamond:wght@400;500;600&family=Marcellus+SC&family=Source+Sans+3:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <!-- Apply the saved theme before first paint so there's no flash -->
    <script>
      try {
        var d = document.documentElement, g = function (k) { return JSON.parse(localStorage.getItem(k)); };
        d.dataset.skin = g("oot-skin") || "kokiri";
        d.dataset.theme = g("oot-mode") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        d.dataset.density = g("oot-density") || "comfortable";
      } catch (e) { document.documentElement.dataset.skin = "kokiri"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
